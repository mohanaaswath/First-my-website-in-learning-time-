<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>books app </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <div class="navbar">
        <h1>BOOK APP</h1>
    </div>

    <div class="container">
        <div class="bookcontainer">
            <h2>MY BOOK</h2>
            <h5>MOHAN</h5>
            <P>Lorem ipsum dolor sit amet consectetur adipisicing elit. Fuga dolorum accusantium eveniet nostrum quibusdam autem architecto, velit atque eos quia explicabo maxime. Cum quod doloribus molestiae doloremque possimus cumque quisquam.</P>
            <button onclick="deletebook(event)">Delete</button>
        </div>
    </div>

    <div class="popupoverlay"></div>

    <div class="popupbox">
        <h2>ADD BOOK</h2>
        <form>
            <input type="text" placeholder=" Book Name" id="booktitle">
            <input type="text" placeholder="Book Author" id="bookauthor">
            <textarea placeholder="Book Details" id="bookdetails"></textarea>
            <button id="addbook">ADD</button>
            <button id="cancelbook">CANCEL</button>
        </form>
    </div>

    <button class="addbutton" id="addpopup-button">+</button>

    <script src="script.js"></script>


</body>
</html>
